<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Damakasu Logo Concepts</title>
<style>
  :root { --navy:#0F172A; --green:#14532D; --paper:#F7F8F7; }
  body { margin:0; font-family: system-ui, sans-serif; background: var(--paper); color: var(--navy); }
  header { padding: 32px 24px 8px; max-width: 1100px; margin: auto; }
  h1 { font-size: 28px; margin: 0 0 6px; } header p { margin: 0; color: #475569; }
  .concept { max-width: 1100px; margin: 24px auto; padding: 0 24px; }
  h2 { font-size: 20px; } h2 span { font-size: 13px; color: var(--green); font-weight: 600; margin-left: 8px; text-transform: uppercase; letter-spacing: .1em; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
  figure { margin: 0; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; justify-content: center; gap: 10px; border: 1px solid #e2e8f0; }
  .light { background: #fff; } .dark { background: var(--navy); border-color: var(--navy); }
  .dark figcaption { color: #cbd5e1; }
  figure > img { width: 100%; height: auto; }
  .square img { width: 60%; margin: auto; }
  .sizes div { display: flex; align-items: end; gap: 18px; }
  .fakeheader { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .fakeheader img { height: 56px; width: auto; } .fakeheader span { font-size: 11px; color: #64748b; }
  figcaption { font-size: 12px; color: #64748b; }
</style></head><body>
<header><h1>Damakasu Multi-Link Investment Ltd — logo concepts</h1>
<p>Three directions. Wordmark set in Playfair Display ExtraBold with DM Sans tagline (the site's fonts), converted to outlines.</p></header>

  <section class="concept">
    <h2>Monogram <span>concept A</span></h2>
    <div class="grid">
      <figure class="light"><img src="a-monogram-horizontal-color.svg" alt="Monogram — full colour"><figcaption>Full colour</figcaption></figure>
      <figure class="dark"><img src="a-monogram-horizontal-dark.svg" alt="Monogram — on dark"><figcaption>On dark</figcaption></figure>
      <figure class="light"><img src="a-monogram-horizontal-mono.svg" alt="Monogram — single colour"><figcaption>Single colour</figcaption></figure>
      <figure class="light square"><img src="a-monogram-stacked.svg" alt="Monogram — stacked"><figcaption>Stacked (social avatar)</figcaption></figure>
      <figure class="light sizes"><div>
        <img src="a-monogram-icon.svg" width="16" height="16" alt=""><img src="a-monogram-icon.svg" width="32" height="32" alt="">
        <img src="a-monogram-icon.svg" width="64" height="64" alt=""></div><figcaption>Favicon 16 / 32 / 64 px</figcaption></figure>
      <figure class="light header"><div class="fakeheader"><img src="a-monogram-horizontal-color.svg" alt=""><span>Home · About Us · Products · Contact</span></div><figcaption>In the site header (56 px tall)</figcaption></figure>
    </div>
  </section>
  <section class="concept">
    <h2>Multi-Link <span>concept B</span></h2>
    <div class="grid">
      <figure class="light"><img src="b-multilink-horizontal-color.svg" alt="Multi-Link — full colour"><figcaption>Full colour</figcaption></figure>
      <figure class="dark"><img src="b-multilink-horizontal-dark.svg" alt="Multi-Link — on dark"><figcaption>On dark</figcaption></figure>
      <figure class="light"><img src="b-multilink-horizontal-mono.svg" alt="Multi-Link — single colour"><figcaption>Single colour</figcaption></figure>
      <figure class="light square"><img src="b-multilink-stacked.svg" alt="Multi-Link — stacked"><figcaption>Stacked (social avatar)</figcaption></figure>
      <figure class="light sizes"><div>
        <img src="b-multilink-icon.svg" width="16" height="16" alt=""><img src="b-multilink-icon.svg" width="32" height="32" alt="">
        <img src="b-multilink-icon.svg" width="64" height="64" alt=""></div><figcaption>Favicon 16 / 32 / 64 px</figcaption></figure>
      <figure class="light header"><div class="fakeheader"><img src="b-multilink-horizontal-color.svg" alt=""><span>Home · About Us · Products · Contact</span></div><figcaption>In the site header (56 px tall)</figcaption></figure>
    </div>
  </section>
  <section class="concept">
    <h2>Harvest Shield <span>concept C</span></h2>
    <div class="grid">
      <figure class="light"><img src="c-growth-horizontal-color.svg" alt="Harvest Shield — full colour"><figcaption>Full colour</figcaption></figure>
      <figure class="dark"><img src="c-growth-horizontal-dark.svg" alt="Harvest Shield — on dark"><figcaption>On dark</figcaption></figure>
      <figure class="light"><img src="c-growth-horizontal-mono.svg" alt="Harvest Shield — single colour"><figcaption>Single colour</figcaption></figure>
      <figure class="light square"><img src="c-growth-stacked.svg" alt="Harvest Shield — stacked"><figcaption>Stacked (social avatar)</figcaption></figure>
      <figure class="light sizes"><div>
        <img src="c-growth-icon.svg" width="16" height="16" alt=""><img src="c-growth-icon.svg" width="32" height="32" alt="">
        <img src="c-growth-icon.svg" width="64" height="64" alt=""></div><figcaption>Favicon 16 / 32 / 64 px</figcaption></figure>
      <figure class="light header"><div class="fakeheader"><img src="c-growth-horizontal-color.svg" alt=""><span>Home · About Us · Products · Contact</span></div><figcaption>In the site header (56 px tall)</figcaption></figure>
    </div>
  </section>
</body></html>
