<!doctype html>
<html lang="en">
 <head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ============================================================
       Security Headers (meta-tag layer — enforced server-side too)
       ============================================================ -->
  <!-- Prevents MIME-type sniffing attacks -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <!-- Controls referrer information sent with requests -->
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <!-- Content Security Policy (also sent as an HTTP header by public/.htaccess, which adds
       frame-ancestors and upgrade-insecure-requests — directives a <meta> tag cannot carry). -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' https://www.google.com https://www.gstatic.com;
    style-src 'self' 'unsafe-inline';
    font-src 'self';
    img-src 'self' data: https://www.google.com https://www.gstatic.com;
    connect-src 'self' https://*.supabase.co https://www.google.com;
    frame-src https://www.google.com https://recaptcha.google.com;
    object-src 'none';
    base-uri 'self';
    form-action 'self';
  " />

  <!-- Per-page SEO tags (title, description, canonical, Open Graph, JSON-LD) are injected here at build time
       by scripts/prerender.mjs and kept in sync during navigation by src/components/Seo.tsx. -->
  <!--seo-head-->
  <title data-seo="">Damakasu Multi-Link Investment Ltd | Agricultural Commodities</title>

  <meta name="author" content="Damakasu Multi-Link Investment Ltd" />
  <!-- Bing Webmaster Tools ownership verification — keep after verification succeeds. -->
  <meta name="msvalidate.01" content="D0BD415A048F7233A488B25D369813FC" />
  <meta name="theme-color" content="#0F172A" />
  <meta name="format-detection" content="telephone=no" />

  <!-- Favicons -->
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
</head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
