# Supabase CLI settings for this project (see supabase/README.md for deployment steps).
project_id = "damakasu"

# The contact form is public: requests are checked by reCAPTCHA, rate limiting and validation
# inside the function, so the gateway does not require a user JWT. This also lets the site use
# the newer non-JWT "publishable" API keys.
[functions.submit-quote]
verify_jwt = false
